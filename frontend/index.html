<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HYPER - Gym, Sport &amp; Conditioning</title>

  <!-- Google Fonts: Lexend + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

  <!-- PWA -->
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HyperGym" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- DEBUG: GLOBAL ERROR HANDLER FOR WHITE SCREEN -->
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      if (typeof message === 'string' && message.includes('ResizeObserver')) return;
      if (typeof message === 'string' && message.includes('Script error.') && lineno === 0) return;
      alert("APP CRASH: " + message + "\nLine: " + lineno);
    };
    window.addEventListener('unhandledrejection', function (event) {
      alert("PROMISE ERROR: " + event.reason);
    });
  </script>
</head>

<body style="background: #f8f7f5; color: #1e293b;" class="overscroll-none font-display antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
