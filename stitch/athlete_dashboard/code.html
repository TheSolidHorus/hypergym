<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff6a00",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<!-- Header -->
<header class="flex items-center p-6 justify-between">
<div class="flex items-center gap-3">
<div class="size-12 rounded-full overflow-hidden border-2 border-primary/20">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a fit smiling man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZ76SquJX1UtZIQVNkjGReudWW8XrIfSiTfWUA3E4q1Kf-EEyYm8hW0ve1rDjHrEvL2O1kbcckLVFAHuJJ6fsuyojO-GBLLdbaS0Rd1L2Ov4ody0-xTEKXznGnqcYJ1dgaATIg0pw_l8M6vnVgO5Yl0PA92SpuLR0CNakAEH3VC1OjdzPxm5L5gXciRMHlwzO7anCrlG78NMfFje300gTxS7C_HJMBMgKEZhaRS87EL8G1YZU18Z8ueYQ8ct-TkBmaLZRXXzC2L6Q"/>
</div>
<div>
<p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Bentornato</p>
<h2 class="text-xl font-bold leading-tight tracking-tight">CIAO, MARCO</h2>
</div>
</div>
<button class="flex size-10 items-center justify-center rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 pb-24">
<!-- Today's Workout Card -->
<section class="mb-8">
<h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-3">Allenamento di Oggi</h3>
<div class="relative overflow-hidden rounded-xl bg-slate-900 aspect-[16/10] group">
<img alt="Workout Background" class="absolute inset-0 w-full h-full object-cover opacity-60 blur-[1px]" data-alt="Athlete performing heavy squats in a moody gym setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2JTCFyDyZ01UdkAfsqSDUIeVi5GJP_ZJn4MJ_ichL2C6jIAMevLTVazuD-2rIwwPkf2vARZoVKTzWnmCeirPrtlvZQ3VLAAQxotVRbls9myCNtsM7Ud0GMJAHJXrK2dRex5GbHWuo33QPrso9F-FcI1_jILhGVu28cL210TP0o-EsMr_GnIPD018zFQjlVrLX6HJW64eVmxqg94Bk4EOT42uC-02wFFd1V-LXdhNVoWOVCFkhAYAFZ09PalYa0_YyD_OkTsJA4fs"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
<div class="absolute bottom-0 left-0 right-0 p-6 flex flex-col gap-1">
<span class="text-primary font-bold text-xs uppercase tracking-widest">Power Session</span>
<h4 class="text-white text-2xl font-bold mb-4">LEG DAY - POWER</h4>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
<span>Inizia</span>
<span class="material-symbols-outlined text-sm">play_arrow</span>
</button>
</div>
</div>
</section>
<!-- Progress Grid -->
<section>
<div class="flex items-center justify-between mb-4">
<h3 class="text-lg font-bold">I Tuoi Progressi</h3>
<button class="text-primary text-sm font-semibold">Vedi tutto</button>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Weight Card -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm flex flex-col gap-3">
<div class="size-10 rounded-lg bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-blue-500">monitoring</span>
</div>
<div>
<p class="text-2xl font-bold tracking-tight">75kg</p>
<p class="text-slate-500 text-sm">Peso Attuale</p>
</div>
</div>
<!-- Streak Card -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm flex flex-col gap-3">
<div class="size-10 rounded-lg bg-orange-50 dark:bg-orange-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">flare</span>
</div>
<div>
<p class="text-2xl font-bold tracking-tight">5 Giorni</p>
<p class="text-slate-500 text-sm">Streak</p>
</div>
</div>
<!-- Active Minutes Card (Full Width Span) -->
<div class="col-span-2 bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center gap-4">
<div class="size-12 rounded-lg bg-green-50 dark:bg-green-900/20 flex items-center justify-center">
<span class="material-symbols-outlined text-green-500">schedule</span>
</div>
<div class="flex-1">
<p class="text-2xl font-bold tracking-tight">45m</p>
<p class="text-slate-500 text-sm">Minuti Attivi Oggi</p>
</div>
<div class="h-2 w-24 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="bg-green-500 h-full w-[75%] rounded-full"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-6 py-3 pb-6 flex justify-between items-center z-50">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined text-[28px] fill-[1]">grid_view</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Pannello</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[28px]">fitness_center</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Esercizi</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[28px]">insights</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Progressi</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[28px]">person</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Profilo</span>
</a>
</nav>
</div>
</body></html>
