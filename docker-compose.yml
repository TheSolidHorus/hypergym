services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      # MED-04 FIX: Usa variabili d'ambiente per le credenziali DB
      # Definisci POSTGRES_PASSWORD in un file .env Docker o come segreto del CI/CD
      POSTGRES_USER: ${POSTGRES_USER:-pump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD è obbligatoria in produzione}
      POSTGRES_DB: ${POSTGRES_DB:-pump_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pump}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    volumes:
      - ./backend/app:/code/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pump}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pump_db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY è obbligatoria}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD è obbligatoria}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ENV=${ENV:-development}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
